name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: scripts/test.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-logs
          path: test-logs/
          retention-days: 7
